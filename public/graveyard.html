<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

body{

    margin:0;
    overflow:hidden;
    background:transparent;

}

#title{

    text-align:center;

    font-size:52px;

    margin-bottom:15px;

}

#graveyard{

    position:relative;

    width:100%;

    height:450px;

    overflow:hidden;

    /*
     * Fade the top and bottom of the
     * graveyard so names smoothly
     * appear and disappear.
     */

    mask-image:linear-gradient(
        to bottom,
        transparent,
        black 10%,
        black 90%,
        transparent
    );

    -webkit-mask-image:linear-gradient(
        to bottom,
        transparent,
        black 10%,
        black 90%,
        transparent
    );

}

#scrollContainer{

    position:absolute;

    width:100%;

    left:0;

    top:0;

    will-change:transform;

}

.list{

    width:100%;

}

.pokemon{

    width:100%;

    text-align:center;

    font-size:42px;

    /*
     * IMPORTANT:
     *
     * Use padding instead of margin.
     * This prevents margin collapsing and
     * makes the list height predictable.
     */

    padding:18px 0;

    box-sizing:border-box;

}

@keyframes scrollUp{

    from{

        transform:translateY(0);

    }

    to{

        transform:
            translateY(calc(-1 * var(--scroll-distance)));

    }

}

</style>

</head>


<body>


<div id="title">

Loading...

</div>


<div id="graveyard">

    <div id="scrollContainer">

        <div id="list1" class="list"></div>

        <div id="list2" class="list"></div>

    </div>

</div>


<script>


const params =
    new URLSearchParams(window.location.search);


const channel =
    params.get("channel");


let previousJSON = "";



async function updateGraveyard(){


    try{


        const response =
            await fetch(
                "/shownuzdeaths/data?channel=" +
                encodeURIComponent(channel)
            );


        const data =
            await response.json();



        const json =
            JSON.stringify(data);



        /*
         * If absolutely nothing changed,
         * leave the animation alone.
         */

        if(json === previousJSON)
            return;



        previousJSON = json;



        /*
         * Apply the user's overlay settings.
         */

        document.body.style.color =
            data.color;


        document.body.style.fontFamily =
            "'" + data.font + "', sans-serif";



        document.getElementById("title").textContent =
            "☠ Graveyard (" +
            data.count +
            ") ☠";



        const container =
            document.getElementById(
                "scrollContainer"
            );


        const list1 =
            document.getElementById(
                "list1"
            );


        const list2 =
            document.getElementById(
                "list2"
            );



        /*
         * Stop the animation while we
         * rebuild the lists.
         */

        container.style.animation =
            "none";



        /*
         * Clear both lists.
         */

        list1.innerHTML = "";

        list2.innerHTML = "";



        /*
         * Build both lists.
         */

        if(data.names.length === 0){


            addPokemon(
                list1,
                "Nobody has fallen... yet!"
            );


            addPokemon(
                list2,
                "Nobody has fallen... yet!"
            );

        }
        else{


            data.names.forEach(function(name){

                addPokemon(
                    list1,
                    name
                );

            });


            data.names.forEach(function(name){

                addPokemon(
                    list2,
                    name
                );

            });

        }



        /*
         * Wait for the browser to finish
         * laying everything out.
         */

        requestAnimationFrame(function(){


            /*
             * Get the actual screen position
             * of each list.
             */

            const firstPosition =
                list1.getBoundingClientRect();


            const secondPosition =
                list2.getBoundingClientRect();



            /*
             * The exact distance between
             * the beginning of list 1 and
             * the beginning of list 2.
             */

            const distance =
                secondPosition.top -
                firstPosition.top;



            /*
             * Tell CSS the exact distance
             * it needs to travel.
             */

            container.style.setProperty(
                "--scroll-distance",
                distance + "px"
            );



            /*
             * Choose the speed based on
             * the amount of content.
             *
             * This is pixels per second.
             */

            const pixelsPerSecond = 35;


            const duration =
                distance /
                pixelsPerSecond;



            /*
             * Don't allow extremely short
             * animations.
             */

            const finalDuration =
                Math.max(
                    15,
                    duration
                );



            /*
             * Force the browser to acknowledge
             * the animation reset.
             */

            void container.offsetWidth;



            /*
             * Start the animation.
             */

            container.style.animation =
                "scrollUp " +
                finalDuration +
                "s linear infinite";


        });


    }
    catch(error){


        console.error(
            "Failed to update graveyard:",
            error
        );


    }

}



/*
 * Helper function for creating
 * each Pokémon entry.
 */

function addPokemon(
    container,
    name
){

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "pokemon";


    div.textContent =
        "☠ " + name;


    container.appendChild(
        div
    );

}



/*
 * Initial load.
 */

updateGraveyard();



/*
 * Check for new deaths every
 * two seconds.
 */

setInterval(
    updateGraveyard,
    2000
);


</script>


</body>

</html>
