<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;

}


body {

    color: white;

}


#title {

    width: 100%;

    text-align: center;

    font-size: 52px;

    margin-bottom: 15px;

}


#graveyard {

    position: relative;

    width: 100%;

    height: 450px;

    overflow: hidden;


    /*
     * Fade the names as they enter
     * and leave the graveyard.
     */

    mask-image: linear-gradient(
        to bottom,

        transparent 0%,

        black 10%,

        black 90%,

        transparent 100%
    );

    -webkit-mask-image: linear-gradient(
        to bottom,

        transparent 0%,

        black 10%,

        black 90%,

        transparent 100%
    );

}


#scrollContainer {

    position: absolute;

    left: 0;

    top: 0;

    width: 100%;

    will-change: transform;

}


#list {

    width: 100%;

}


.pokemon {

    width: 100%;

    box-sizing: border-box;

    padding: 18px 0;

    text-align: center;

    font-size: 42px;

    white-space: nowrap;

}



</style>

</head>


<body>


<div id="title">

Loading...

</div>


<div id="graveyard">

    <div id="scrollContainer">

        <div id="list"></div>

    </div>

</div>



<script>


const params =
    new URLSearchParams(
        window.location.search
    );


const channel =
    params.get("channel");


const title =
    document.getElementById(
        "title"
    );


const graveyard =
    document.getElementById(
        "graveyard"
    );


const scrollContainer =
    document.getElementById(
        "scrollContainer"
    );


const list =
    document.getElementById(
        "list"
    );



let names = [];

let listHeight = 0;

let scrollPosition = 0;

let lastTime = null;

let pixelsPerSecond = 35;



/*
 * This function creates one complete
 * copy of the Pokémon list.
 */

function buildList(
    pokemonNames
) {

    list.innerHTML = "";


    if (
        pokemonNames.length === 0
    ) {

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "pokemon";


        div.textContent =
            "Nobody has fallen... yet!";


        list.appendChild(
            div
        );


        return;

    }


    pokemonNames.forEach(
        function(name) {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "pokemon";


            div.textContent =
                "☠ " + name;


            list.appendChild(
                div
            );

        }
    );

}



/*
 * Rebuild enough copies of the list
 * to always have content below the
 * viewport.
 */

function rebuildScroll() {


    /*
     * Start with one copy.
     */

    scrollContainer.innerHTML = "";

    scrollContainer.appendChild(
        list
    );


    /*
     * Force layout so we can determine
     * the exact height of one list.
     */

    listHeight =
        list.getBoundingClientRect().height;


    if (listHeight <= 0)
        return;


    /*
     * We need enough copies that there
     * is ALWAYS another list below the
     * currently visible one.
     *
     * This is especially important when
     * there is only one Pokémon.
     */

    const viewportHeight =
        graveyard.clientHeight;


    const copiesNeeded =
        Math.ceil(
            viewportHeight /
            listHeight
        ) + 3;


    for (
        let i = 1;
        i < copiesNeeded;
        i++
    ) {


        const copy =
            list.cloneNode(true);


        scrollContainer.appendChild(
            copy
        );

    }


    /*
     * Start from the same position.
     */

    scrollPosition = 0;


    scrollContainer.style.transform =
        "translateY(0px)";

}



/*
 * Apply the user's visual settings.
 */

function applySettings(
    data
) {


    document.body.style.color =
        data.color;


    document.body.style.fontFamily =
        "'" +
        data.font +
        "', sans-serif";


    document.body.style.textShadow =
        "0 0 5px " +
        data.color +
        ", 0 0 10px " +
        data.color +
        ", 0 0 20px " +
        data.color;


    title.textContent =
        "☠ Graveyard (" +
        data.count +
        ") ☠";

}



/*
 * Get the latest data.
 */

async function loadData() {


    try {


        const response =
            await fetch(
                "/shownuzdeaths/data?channel=" +
                encodeURIComponent(
                    channel
                ) +
                "&t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Server returned " +
                response.status
            );

        }


        const data =
            await response.json();


        applySettings(
            data
        );


        /*
         * Check whether the list
         * actually changed.
         */

        const newNames =
            JSON.stringify(
                data.names
            );


        const oldNames =
            JSON.stringify(
                names
            );


        if (
            newNames !== oldNames
        ) {


            names =
                data.names.slice();


            buildList(
                names
            );


            /*
             * Give the browser a frame
             * to calculate the new sizes.
             */

            requestAnimationFrame(
                function() {

                    rebuildScroll();

                }
            );

        }

    }
    catch(error) {


        console.error(
            "Failed to load graveyard data:",
            error
        );

    }

}



/*
 * --------------------------------------------------
 * CONTINUOUS SCROLL
 * --------------------------------------------------
 *
 * This is intentionally NOT a CSS animation.
 *
 * JavaScript moves the list every frame.
 *
 * When we've moved exactly one list height,
 * we subtract one list height.
 *
 * Because the next copy is identical,
 * the viewer sees absolutely no jump.
 */

function animate(
    timestamp
) {


    if (
        lastTime === null
    ) {

        lastTime =
            timestamp;

    }


    const deltaTime =
        (
            timestamp -
            lastTime
        ) / 1000;


    lastTime =
        timestamp;


    if (
        listHeight > 0
    ) {


        /*
         * Move downward/upward by
         * an exact number of pixels.
         */

        scrollPosition -=
            pixelsPerSecond *
            deltaTime;


        /*
         * Once we've moved exactly
         * one complete list height,
         * move the position forward
         * by that same amount.
         */

        while (
            scrollPosition <=
            -listHeight
        ) {

            scrollPosition +=
                listHeight;

        }


        scrollContainer.style.transform =
            "translate3d(0, " +
            scrollPosition +
            "px, 0)";

    }


    requestAnimationFrame(
        animate
    );

}



/*
 * Load immediately.
 */

loadData();



/*
 * Check the server every two seconds.
 */

setInterval(
    loadData,
    2000
);



/*
 * Start the continuous animation.
 */

requestAnimationFrame(
    animate
);


</script>


</body>

</html>
