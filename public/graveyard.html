<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

body{

    margin:0;
    overflow:hidden;
    background:transparent;

    color:white;

    font-family:Merienda,sans-serif;

    /* Main neon glow */
    text-shadow:
        0 0 3px currentColor,
        0 0 6px currentColor,
        0 0 12px currentColor,
        0 0 20px currentColor,
        0 0 35px currentColor;

}


/* =========================
   GRAVEYARD TITLE
   ========================= */

#title{

    text-align:center;

    font-size:52px;

    margin-bottom:15px;

    color:inherit;

    text-shadow:
        0 0 4px currentColor,
        0 0 8px currentColor,
        0 0 15px currentColor,
        0 0 25px currentColor,
        0 0 45px currentColor,
        0 0 70px currentColor;

}


/* =========================
   GRAVEYARD WINDOW
   ========================= */

#graveyard{

    position:relative;

    width:100%;

    height:450px;

    overflow:hidden;

    /*
        Fade the names in/out
        at the top and bottom.
    */

    mask-image:linear-gradient(
        to bottom,
        transparent,
        black 10%,
        black 90%,
        transparent
    );

    -webkit-mask-image:linear-gradient(
        to bottom,
        transparent,
        black 10%,
        black 90%,
        transparent
    );

}


/* =========================
   SCROLLING LIST
   ========================= */

#scrollContainer{

    position:absolute;

    width:100%;

}


/* =========================
   POKEMON NAMES
   ========================= */

.pokemon{

    width:100%;

    text-align:center;

    font-size:42px;

    margin:18px 0;

    /*
        Neon glow around every name
    */

    text-shadow:
        0 0 3px currentColor,
        0 0 6px currentColor,
        0 0 10px currentColor,
        0 0 18px currentColor,
        0 0 30px currentColor;

}


/* =========================
   SCROLL ANIMATION
   ========================= */

@keyframes scrollUp{

    from{

        transform:translateY(100%);

    }

    to{

        transform:translateY(-100%);

    }

}

</style>

</head>

<body>

<div id="title">
Loading...
</div>

<div id="graveyard">

<div id="scrollContainer"></div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const channel = params.get("channel");

let previousJSON = "";

async function updateGraveyard(){

    const response = await fetch("/shownuzdeaths/data?channel=" + channel);

    const data = await response.json();

    const json = JSON.stringify(data);

    if(json === previousJSON)
        return;

    previousJSON = json;

    document.body.style.color = data.color;

    document.body.style.fontFamily =
        data.font + ", sans-serif";

    document.getElementById("title").innerHTML =
        "☠ Graveyard ☠";

    const container =
    document.getElementById("scrollContainer");

container.innerHTML = "";


// =========================
// NOBODY HAS DIED
// =========================

if(data.names.length === 0){

    // Stop any previous scrolling animation
    container.style.animation = "none";

    container.innerHTML =
        "<div class='pokemon'>Nobody has fallen... yet!</div>";

    return;

}


// =========================
// BUILD GRAVEYARD
// =========================

data.names.forEach(function(name){

    const div = document.createElement("div");

    div.className = "pokemon";

    div.textContent = "☠ " + name;

    container.appendChild(div);

});


// Spacer between the two copies

const spacer = document.createElement("div");

spacer.style.height = "250px";

container.appendChild(spacer);


// Second copy for looping

data.names.forEach(function(name){

    const div = document.createElement("div");

    div.className = "pokemon";

    div.textContent = "☠ " + name;

    container.appendChild(div);

});


// =========================
// START SCROLLING
// =========================

const speed = Math.max(20, data.names.length * 3);

container.style.animation =
    "scrollUp " + speed + "s linear infinite";

}

updateGraveyard();

setInterval(updateGraveyard,2000);

</script>

</body>

</html>
