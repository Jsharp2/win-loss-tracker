```html
<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

body{

    margin:0;
    overflow:hidden;
    background:transparent;

    color:white;

    font-family:Merienda,sans-serif;

    /* Main neon glow */
    text-shadow:
        0 0 3px currentColor,
        0 0 6px currentColor,
        0 0 12px currentColor,
        0 0 20px currentColor,
        0 0 35px currentColor;

}


/* =========================
   GRAVEYARD TITLE
   ========================= */

#title{

    text-align:center;

    font-size:52px;

    margin-bottom:15px;

    color:inherit;

    text-shadow:
        0 0 4px currentColor,
        0 0 8px currentColor,
        0 0 15px currentColor,
        0 0 25px currentColor,
        0 0 45px currentColor,
        0 0 70px currentColor;

}


/* =========================
   GRAVEYARD WINDOW
   ========================= */

#graveyard{

    position:relative;

    width:100%;

    height:450px;

    overflow:hidden;

    mask-image:linear-gradient(
        to bottom,
        transparent,
        black 10%,
        black 90%,
        transparent
    );

    -webkit-mask-image:linear-gradient(
        to bottom,
        transparent,
        black 10%,
        black 90%,
        transparent
    );

}


/* =========================
   SCROLLING LIST
   ========================= */

#scrollContainer{

    position:absolute;

    width:100%;

    /* Important: start in a neutral position */
    transform:translateY(0);

}


/* =========================
   POKEMON NAMES
   ========================= */

.pokemon{

    width:100%;

    text-align:center;

    font-size:42px;

    margin:18px 0;

    text-shadow:
        0 0 3px currentColor,
        0 0 6px currentColor,
        0 0 10px currentColor,
        0 0 18px currentColor,
        0 0 30px currentColor;

}


/* =========================
   NO DEATHS MESSAGE
   ========================= */

.noDeaths{

    position:absolute;

    width:100%;

    left:0;

    top:50%;

    transform:translateY(-50%);

    margin:0;

    text-align:center;

}


/* =========================
   SCROLL ANIMATION
   ========================= */

@keyframes scrollUp{

    from{

        transform:translateY(100%);

    }

    to{

        transform:translateY(-100%);

    }

}

</style>

</head>


<body>

<div id="title">
Loading...
</div>


<div id="graveyard">

<div id="scrollContainer"></div>

</div>


<script>


const params =
    new URLSearchParams(window.location.search);


const channel =
    params.get("channel");


let previousJSON = "";


async function updateGraveyard(){

    try{

        const response =
            await fetch(
                "/shownuzdeaths/data?channel=" + channel
            );


        const data =
            await response.json();


        const json =
            JSON.stringify(data);


        // Nothing changed, so don't rebuild
        // the graveyard or restart the animation.

        if(json === previousJSON)
            return;


        previousJSON = json;


        document.body.style.color =
            data.color;


        document.body.style.fontFamily =
            data.font + ", sans-serif";


        document.getElementById("title").innerHTML =
            "☠ Graveyard ☠";


        const container =
            document.getElementById(
                "scrollContainer"
            );


        // =========================
        // RESET CONTAINER
        // =========================

        container.innerHTML = "";

        container.style.animation = "none";

        container.style.transform =
            "translateY(0)";


        // =========================
        // NOBODY HAS DIED
        // =========================

        if(data.names.length === 0){

            const message =
                document.createElement("div");

            message.className =
                "pokemon noDeaths";

            message.textContent =
                "Nobody has fallen... yet!";

            container.appendChild(message);

            return;

        }


        // =========================
        // BUILD FIRST LIST
        // =========================

        data.names.forEach(function(name){

            const div =
                document.createElement("div");

            div.className =
                "pokemon";

            div.textContent =
                "☠ " + name;

            container.appendChild(div);

        });


        // =========================
        // SPACER
        // =========================

        const spacer =
            document.createElement("div");

        spacer.style.height =
            "250px";

        container.appendChild(spacer);


        // =========================
        // SECOND LIST
        // =========================

        data.names.forEach(function(name){

            const div =
                document.createElement("div");

            div.className =
                "pokemon";

            div.textContent =
                "☠ " + name;

            container.appendChild(div);

        });


        // =========================
        // START SCROLLING
        // =========================

        const speed =
            Math.max(
                20,
                data.names.length * 3
            );


        container.style.animation =
            "scrollUp " +
            speed +
            "s linear infinite";

    }

    catch(error){

        console.error(
            "Failed to update graveyard:",
            error
        );

    }

}


updateGraveyard();


setInterval(
    updateGraveyard,
    2000
);

</script>


</body>

</html>
```
