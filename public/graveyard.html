<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

body{
    margin:0;
    overflow:hidden;
    background:transparent;
}

#title{
    text-align:center;
    font-size:52px;
    margin-bottom:15px;
}

#graveyard{
    position:relative;
    width:100%;
    height:450px;
    overflow:hidden;

    mask-image:linear-gradient(
        to bottom,
        transparent,
        black 10%,
        black 90%,
        transparent
    );

    -webkit-mask-image:linear-gradient(
        to bottom,
        transparent,
        black 10%,
        black 90%,
        transparent
    );
}

#scrollContainer{
    position:absolute;
    width:100%;
    left:0;
    top:0;
}

.list{
    width:100%;
}

.pokemon{
    width:100%;
    text-align:center;
    font-size:42px;
    margin:18px 0;
}

@keyframes scrollUp{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(calc(-1 * var(--scroll-distance)));
    }

}
</style>

</head>

<body>

<div id="title">Loading...</div>

<div id="graveyard">
    <div id="scrollContainer">
        <div id="list1"></div>
        <div id="list2"></div>
    </div>
</div>

<script>

const params = new URLSearchParams(window.location.search);

const channel = params.get("channel");

let previousJSON = "";

async function updateGraveyard(){

    let previousJSON = "";

async function updateGraveyard(){

    const response = await fetch("/shownuzdeaths/data?channel=" + channel);

    const data = await response.json();

    const json = JSON.stringify(data);

    if(json === previousJSON)
        return;

    previousJSON = json;

    document.body.style.color = data.color;
    document.body.style.fontFamily = data.font + ", sans-serif";

    document.getElementById("title").textContent =
        "☠ Graveyard (" + data.count + ") ☠";

    const list1 = document.getElementById("list1");
    const list2 = document.getElementById("list2");
    const container = document.getElementById("scrollContainer");

    list1.innerHTML = "";
    list2.innerHTML = "";

    if(data.names.length === 0){

        list1.innerHTML =
            "<div class='pokemon'>Nobody has fallen... yet!</div>";

        list2.innerHTML = list1.innerHTML;

    }
    else{

        data.names.forEach(function(name){

            const div = document.createElement("div");

            div.className = "pokemon";

            div.textContent = "☠ " + name;

            list1.appendChild(div);

        });

        list2.innerHTML = list1.innerHTML;

    }

    requestAnimationFrame(function(){

        const distance = list1.offsetHeight;

        container.style.setProperty(
            "--scroll-distance",
            distance + "px"
        );

        const speed = Math.max(15, distance / 40);

        container.style.animation = "none";

        void container.offsetWidth;

        container.style.animation =
            "scrollUp " + speed + "s linear infinite";

    });

}

updateGraveyard();

setInterval(updateGraveyard,2000);

</script>

</body>

</html>
