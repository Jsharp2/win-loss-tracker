<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<style>

body {

    margin: 0;

    overflow: hidden;

    background: transparent;

}


#title {

    text-align: center;

    font-size: 52px;

    margin-bottom: 15px;

}


#graveyard {

    position: relative;

    width: 100%;

    height: 450px;

    overflow: hidden;


    /*
     * Fade the top and bottom.
     */

    mask-image: linear-gradient(
        to bottom,
        transparent,
        black 10%,
        black 90%,
        transparent
    );

    -webkit-mask-image: linear-gradient(
        to bottom,
        transparent,
        black 10%,
        black 90%,
        transparent
    );

}


#scrollContainer {

    position: absolute;

    width: 100%;

    left: 0;

    top: 0;

    will-change: transform;

}


.pokemon {

    width: 100%;

    text-align: center;

    font-size: 42px;

    /*
     * Use padding instead of margin so
     * every Pokémon has predictable height.
     */

    padding: 18px 0;

    box-sizing: border-box;

}


@keyframes scrollUp {

    from {

        transform: translateY(0);

    }

    to {

        transform:
            translateY(calc(-1 * var(--scroll-distance)));

    }

}

</style>

</head>


<body>


<div id="title">

Loading...

</div>


<div id="graveyard">

    <div id="scrollContainer"></div>

</div>


<script>


const params =
    new URLSearchParams(window.location.search);


const channel =
    params.get("channel");


let previousJSON = "";



async function updateGraveyard() {


    try {


        const response =
            await fetch(
                "/shownuzdeaths/data?channel=" +
                encodeURIComponent(channel)
            );


        const data =
            await response.json();


        const json =
            JSON.stringify(data);


        /*
         * Don't rebuild the animation unless
         * the actual data changed.
         */

        if (json === previousJSON) {

            return;

        }


        previousJSON = json;



        /*
         * Apply color.
         */

        document.body.style.color =
            data.color;



        /*
         * Apply font.
         */

        document.body.style.fontFamily =
            "'" +
            data.font +
            "', sans-serif";



        /*
         * Update title.
         */

        document.getElementById(
            "title"
        ).textContent =
            "☠ Graveyard (" +
            data.count +
            ") ☠";



        const container =
            document.getElementById(
                "scrollContainer"
            );



        /*
         * Stop the old animation.
         */

        container.style.animation =
            "none";



        /*
         * Clear everything.
         */

        container.innerHTML = "";



        /*
         * If there are no deaths.
         */

        if (data.names.length === 0) {


            const empty =
                document.createElement(
                    "div"
                );


            empty.className =
                "pokemon";


            empty.textContent =
                "Nobody has fallen... yet!";


            container.appendChild(
                empty
            );


            return;

        }



        /*
         * ------------------------------------------------
         * BUILD ONE COMPLETE SEQUENCE
         * ------------------------------------------------
         */

        const sequence =
            document.createElement(
                "div"
            );


        sequence.id =
            "sequence";


        sequence.style.width =
            "100%";



        data.names.forEach(function(name) {


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "pokemon";


            div.textContent =
                "☠ " + name;


            sequence.appendChild(
                div
            );


        });



        /*
         * Add the first sequence.
         */

        container.appendChild(
            sequence
        );



        /*
         * Wait for the browser to calculate
         * the actual height.
         */

        requestAnimationFrame(function() {


            const sequenceHeight =
                sequence.offsetHeight;


            const graveyardHeight =
                document.getElementById(
                    "graveyard"
                ).offsetHeight;



            /*
             * We need enough copies to completely
             * fill the screen while scrolling.
             *
             * For example, if the graveyard is
             * 450px tall and the sequence is
             * only 72px tall, we'll create
             * enough copies to cover that 450px.
             */

            const copiesNeeded =
                Math.ceil(
                    graveyardHeight /
                    sequenceHeight
                ) + 2;



            /*
             * Add additional copies.
             */

            for (
                let i = 1;
                i < copiesNeeded;
                i++
            ) {


                const copy =
                    sequence.cloneNode(
                        true
                    );


                container.appendChild(
                    copy
                );

            }



            /*
             * The distance we need to travel
             * is exactly ONE sequence.
             */

            container.style.setProperty(
                "--scroll-distance",
                sequenceHeight + "px"
            );



            /*
             * Scroll speed.
             *
             * Increase this number to make
             * the scrolling slower.
             */

            const pixelsPerSecond =
                35;


            const duration =
                sequenceHeight /
                pixelsPerSecond;



            /*
             * Start the animation.
             */

            void container.offsetWidth;


            container.style.animation =
                "scrollUp " +
                Math.max(
                    2,
                    duration
                ) +
                "s linear infinite";


        });


    }
    catch (error) {


        console.error(
            "Failed to update graveyard:",
            error
        );


    }

}



/*
 * Initial load.
 */

updateGraveyard();



/*
 * Check for changes every two seconds.
 */

setInterval(
    updateGraveyard,
    2000
);


</script>


</body>

</html>
