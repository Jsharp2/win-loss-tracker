```html
<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

/* =========================
   BODY
   ========================= */

body{

    margin:0;
    overflow:hidden;
    background:transparent;

    color:white;

    font-family:Merienda,sans-serif;

    text-shadow:
        0 0 3px currentColor,
        0 0 6px currentColor,
        0 0 12px currentColor,
        0 0 20px currentColor,
        0 0 35px currentColor;

}


/* =========================
   GRAVEYARD TITLE
   ========================= */

#title{

    text-align:center;

    font-size:52px;

    margin-bottom:15px;

    color:inherit;

    text-shadow:
        0 0 4px currentColor,
        0 0 8px currentColor,
        0 0 15px currentColor,
        0 0 25px currentColor,
        0 0 45px currentColor,
        0 0 70px currentColor;

}


/* =========================
   GRAVEYARD WINDOW
   ========================= */

#graveyard{

    position:relative;

    width:100%;
    height:450px;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    mask-image:linear-gradient(
        to bottom,
        transparent,
        black 10%,
        black 90%,
        transparent
    );

    -webkit-mask-image:linear-gradient(
        to bottom,
        transparent,
        black 10%,
        black 90%,
        transparent
    );

}


#noDeaths{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;

    font-size:42px;

    text-shadow:
        0 0 3px currentColor,
        0 0 6px currentColor,
        0 0 10px currentColor,
        0 0 18px currentColor,
        0 0 30px currentColor;

}


/* =========================
   NO DEATHS MESSAGE
   ========================= */

#noDeaths{

    position:absolute;

    top:50%;
    left:0;

    width:100%;

    transform:translateY(-50%);

    text-align:center;

    font-size:42px;

    text-shadow:
        0 0 3px currentColor,
        0 0 6px currentColor,
        0 0 10px currentColor,
        0 0 18px currentColor,
        0 0 30px currentColor;

}


/* =========================
   SCROLLING LIST
   ========================= */

#scrollContainer{

    position:absolute;

    width:100%;

    transform:translateY(0);

}


/* =========================
   POKEMON NAMES
   ========================= */

.pokemon{

    width:100%;

    text-align:center;

    font-size:42px;

    margin:18px 0;

    text-shadow:
        0 0 3px currentColor,
        0 0 6px currentColor,
        0 0 10px currentColor,
        0 0 18px currentColor,
        0 0 30px currentColor;

}


/* =========================
   SCROLL ANIMATION
   ========================= */

@keyframes scrollUp{

    from{

        transform:translateY(100%);

    }

    to{

        transform:translateY(-100%);

    }

}

</style>

</head>


<body>


<!-- =========================
     TITLE
     ========================= -->

<div id="title">
☠ Graveyard ☠
</div>


<!-- =========================
     GRAVEYARD
     ========================= -->

<div id="graveyard">


    <!-- Displayed when there are no deaths -->

    <div id="noDeaths">
        Nobody has fallen... yet!
    </div>


    <!-- Scrolling Pokémon list -->

    <div id="scrollContainer"></div>


</div>


<script>


// =========================
// GET CHANNEL FROM URL
// =========================

const params =
    new URLSearchParams(
        window.location.search
    );


const channel =
    params.get("channel");


// Used to prevent rebuilding
// the overlay when nothing changed.

let previousJSON = "";


// =========================
// UPDATE GRAVEYARD
// =========================

async function updateGraveyard(){

    try{


        // =========================
        // GET DATA
        // =========================

        const response =
            await fetch(
                "/shownuzdeaths/data?channel=" +
                channel
            );


        const data =
            await response.json();


        const json =
            JSON.stringify(data);


        // Nothing changed.

        if(json === previousJSON)
            return;


        previousJSON = json;


        // =========================
        // APPLY SETTINGS
        // =========================

        document.body.style.color =
            data.color;


        document.body.style.fontFamily =
            data.font + ", sans-serif";


        // =========================
        // TITLE
        // =========================

        document.getElementById(
            "title"
        ).innerHTML =
            "☠ Graveyard ☠";


        // =========================
        // GET CONTAINERS
        // =========================

        const container =
            document.getElementById(
                "scrollContainer"
            );


        const noDeaths =
            document.getElementById(
                "noDeaths"
            );


        // =========================
        // RESET SCROLL
        // =========================

        container.innerHTML = "";

        container.style.animation =
            "none";

        container.style.transform =
            "translateY(0)";


        // =========================
        // NO DEATHS
        // =========================

        if(data.names.length === 0){


            // Show centered message

            noDeaths.style.display =
                "block";


            return;

        }


        // =========================
        // HIDE NO-DEATH MESSAGE
        // =========================

        noDeaths.style.display =
            "none";


        // =========================
        // FIRST LIST
        // =========================

        data.names.forEach(
            function(name){


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "pokemon";


                div.textContent =
                    "☠ " + name;


                container.appendChild(
                    div
                );


            }
        );


        // =========================
        // SPACER
        // =========================

        const spacer =
            document.createElement(
                "div"
            );


        spacer.style.height =
            "250px";


        container.appendChild(
            spacer
        );


        // =========================
        // SECOND LIST
        // =========================

        data.names.forEach(
            function(name){


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "pokemon";


                div.textContent =
                    "☠ " + name;


                container.appendChild(
                    div
                );


            }
        );


        // =========================
        // SCROLL SPEED
        // =========================

        const speed =
            Math.max(
                20,
                data.names.length * 3
            );


        // =========================
        // START SCROLLING
        // =========================

        container.style.animation =
            "scrollUp " +
            speed +
            "s linear infinite";


    }

    catch(error){

        console.error(
            "Failed to update graveyard:",
            error
        );

    }

}


// =========================
// INITIAL UPDATE
// =========================

updateGraveyard();


// =========================
// CHECK FOR CHANGES
// EVERY 2 SECONDS
// =========================

setInterval(
    updateGraveyard,
    2000
);


</script>


</body>

</html>
```
